name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Strings
        run: |
          python scripts/gen_l10n.py
          git diff --exit-code -- windows/LazyPDF.Core/Strings.tr.resx l10n/out
      - name: OpenJPEG
        shell: pwsh
        run: ./scripts/build_openjpeg.ps1 -Arch x64
      # Built first, so the tests do not share the runner's cores with the compiler.
      - name: Build
        run: dotnet build windows/LazyPDF.sln -c Release
      - name: Test
        run: dotnet test windows/LazyPDF.sln -c Release --no-build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - name: Build
        run: ./gradlew assembleDebug --console=plain
      - name: Test
        run: ./gradlew testDebugUnitTest --console=plain
