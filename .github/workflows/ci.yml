name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Built first, so the tests do not share the runner's cores with the compiler.
      - name: Build
        run: dotnet build windows/LazyPDF.sln -c Release
      - name: Test
        run: dotnet test windows/LazyPDF.sln -c Release --no-build
