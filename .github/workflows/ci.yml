name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Strings
        run: |
          python scripts/gen_l10n.py
          git diff --exit-code -- windows/LazyPDF.Core/Strings.tr.resx l10n/out
      # Built first, so the tests do not share the runner's cores with the compiler.
      - name: Build
        run: dotnet build windows/LazyPDF.sln -c Release
      - name: Test
        run: dotnet test windows/LazyPDF.sln -c Release --no-build
